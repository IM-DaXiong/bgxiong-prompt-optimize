[package]
name = "bgx-skill-distribution"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bgx-agent-skills-core = { path = "../bgx-agent-skills-core" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
minisign-verify = "0.2"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
