[package]
name = "bgx-internal-prompts"
version = "0.1.0"
edition = "2021"
publish = false
description = "Internal prompt packages: check declarations, freeze a rule set, restore it, and render text. No host, database, or HTTP."

[[bin]]
name = "internal-prompts"
path = "src/bin/internal-prompts.rs"

[dependencies]
bgx-agent-skills-core = { path = "../bgx-agent-skills-core" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
serde_json = "1"
