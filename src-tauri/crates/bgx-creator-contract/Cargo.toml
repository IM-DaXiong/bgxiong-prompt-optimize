[package]
name = "bgx-creator-contract"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure Creator contract verifier shared by build.rs, the runtime host and the CLI gate (CT03)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "verify-creator-contract"
path = "src/bin/verify-creator-contract.rs"