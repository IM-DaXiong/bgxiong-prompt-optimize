[package]
name = "bgx-text-http"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared text-model HTTP exits for the host and the prompt-optimize shell. No tauri, no rusqlite, no story.db."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "native-tls", "charset", "http2", "gzip", "system-proxy", "multipart", "stream"] }
tokio = { version = "1", default-features = false, features = ["time", "macros", "rt"] }
url = "2.5"
once_cell = "1.20"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["time", "macros", "rt", "net"] }

